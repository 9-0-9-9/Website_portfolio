        @font-face {
            font-family: 'GothamBold';

        :root {
            --bg-color: #0b0b0b;

        * {

            padding: 0;
            box-sizing: border-box;
            cursor: none !important;

        /* Custom cursor */
        #custom-cursor {
            position: fixed;
            width: 32px;
            height: 32px;
            pointer-events: none;
            z-index: 99999;
            transform: translate(-50%, -50%);
            transition: filter 0.3s ease;
            image-rendering: pixelated;
        }
        #custom-cursor.clicking {
            filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 18px #a78bfa) drop-shadow(0 0 32px #7c3aed);

        /* Cursor feather particles */
        .cursor-feather {
            position: fixed;
            width: 12px;
            height: auto;
            pointer-events: none;
            z-index: 99998;
            opacity: 0;
            animation: cursorFeatherFade var(--fd, 0.9s) ease-out forwards;

        @keyframes cursorFeatherFade {
            0%   { opacity: 0.85; transform: translate(0,0) rotate(var(--fstart)) scale(1); }
            100% { opacity: 0;    transform: translate(var(--fx), var(--fy)) rotate(var(--fend)) scale(0.3); }
        }

        body {
            background-color: #000;
            color: var(--text-primary);

            height: 100vh;
            width: 100vw;
            overflow: hidden;

            flex-direction: column;
            align-items: center;
            justify-content: center;
            user-select: none;
            position: relative;
        }

        /* Background image (GIF) */
        #bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            filter: blur(10px) brightness(0.35) contrast(1.1);
            pointer-events: none;

        /* Scattered dots */
        .dot {
            position: fixed;
            font-size: 14px;
            font-weight: bold;
            color: #444;
            pointer-events: none;
            opacity: 0;
            z-index: 2;

        @keyframes pulseDot {

            pointer-events: none;

            animation: dropFeatherAnimation 9s ease-in-out forwards;

        @keyframes dropFeatherAnimation {
            0% { opacity: 0; transform: translateY(-40px) rotate(0deg); }
            10% { opacity: 0.5; }
            50% { opacity: 0.5; transform: translateX(50px) translateY(200px) rotate(20deg); }
            85% { opacity: 0.3; transform: translateX(85px) translateY(400px) rotate(35deg); }

            z-index: 99;

        /* Main structure */
        #main-wrapper {
            display: flex;

            justify-content: center;
            height: 100vh;

        #visualizer-and-card {

        /* Profile Card */
        #profile-card {
            background: var(--box-color);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            border-radius: 14px;
            width: 480px;
            padding: 24px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.75),
                        inset 0 1px 0 rgba(255, 255, 255, 0.01);
            position: relative;
            animation: jitterCard 8s ease-in-out infinite;
            overflow: hidden;
        }

        @keyframes jitterCard {
            0% { transform: translate(0, 0) rotate(0deg); }
            10% { transform: translate(1px, -1px) rotate(0.2deg); }
            20% { transform: translate(-1px, 2px) rotate(-0.2deg); }
            30% { transform: translate(1.5px, 1px) rotate(0.4deg); }
            40% { transform: translate(-1.5px, -1.5px) rotate(-0.3deg); }
            50% { transform: translate(2px, -2px) rotate(0deg); }
            60% { transform: translate(-2px, 1px) rotate(0.3deg); }
            70% { transform: translate(1.5px, 2px) rotate(-0.1deg); }
            80% { transform: translate(-1px, -1.5px) rotate(-0.3deg); }
            90% { transform: translate(2px, 1.5px) rotate(0.2deg); }

        .discord-badge-icon {

        /* Card bottom links row (replaces bio) */

        // Spawn dots scattered randomly
        function spawnMoonDots() {
            for (let i = 0; i < 28; i++) {
                const dot = document.createElement('div');
                dot.className = 'dot';
                dot.innerText = '.';
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                dot.style.left = x + 'px';
                dot.style.top = y + 'px';
                dot.style.animationDelay = (Math.random() * 2) + 's';
                document.body.appendChild(dot);
            }
        }
        setTimeout(spawnMoonDots, 150);

        // Spawn falling feathers (using the JPG)
        function spawnFeather() {
            const feather = document.createElement('img');
            feather.src = 'https://raw.githubusercontent.com/9-0-9-9/Website_portfolio/refs/heads/main/IMG_4459.jpg';
            feather.className = 'floating-feather';

            const leftBias = Math.random() < 0.8
                ? Math.random() * (window.innerWidth * 0.45)
                : Math.random() * (window.innerWidth * 0.65);

            feather.style.left = leftBias + 'px';
            feather.style.top = '-50px';
            feather.style.animationDuration = (8 + Math.random() * 4) + 's';
            document.body.appendChild(feather);

            setTimeout(() => {
                feather.remove();
            }, 13000);
        }
        setInterval(spawnFeather, 2500);

            setTimeout(spawnFeather, i * 900);

        function spawnDVDText() {
            const dvd = document.getElementById('dvd-text');
            const randomString = dvdStrings[Math.floor(Math.random() * dvdStrings.length)];
            dvd.innerText = randomString;
            const x = Math.random() * (window.innerWidth - 100);
            const y = Math.random() * (window.innerHeight - 100);
            dvd.style.left = x + 'px';
            dvd.style.top = y + 'px';
            dvd.style.opacity = '0.75';
            setTimeout(() => {
                dvd.style.opacity = '0';

            }, 1200);

        // Audio autoplay
        const audio = document.getElementById('bg-music');
        audio.volume = 1;

        function tryPlay() {
            audio.play().catch(() => {});
        }

        tryPlay();
        window.addEventListener('load', tryPlay);

        const unlockAudio = () => { tryPlay(); document.removeEventListener('click', unlockAudio); document.removeEventListener('keydown', unlockAudio); document.removeEventListener('touchstart', unlockAudio); };
        document.addEventListener('click',      unlockAudio);
        document.addEventListener('keydown',    unlockAudio);
        document.addEventListener('touchstart', unlockAudio);

        // Views counter (shared with main site)

                .then(res => res.json())
                .then(data => {
                    if (data && typeof data.views === 'number') {

                })
                .catch(err => {

                });
        }
        fetchViews();

        // Fetch Discord info for Aida

            fetch('/api/fetch-aida')
                .then(res => res.json())
                .then(data => {
                    if (!data) return;

                    if (data.avatar) {
                        document.getElementById('profile-pic').src = data.avatar;
                    }

                    const nameText = data.global_name || data.username || 'aida';
                    document.getElementById('user-name').innerText = nameText;
                    document.getElementById('user-id').innerText = data.id || '1519167074738376746';

                    const status = data.discord_status || 'offline';
                    const statusIndicator = document.getElementById('status-indicator');
                    statusIndicator.className = 'status-dot';
                    statusIndicator.classList.add('status-' + status);

                    const bannerEl = document.getElementById('profile-banner-el');
                    if (data.banner) {
                        bannerEl.style.backgroundImage = `url('${data.banner}')`;
                    } else if (data.banner_color) {
                        bannerEl.style.backgroundColor = data.banner_color;
                        bannerEl.style.backgroundImage = 'none';
                    } else {
                        bannerEl.style.backgroundImage = `url('https://raw.githubusercontent.com/9-0-9-9/Website_portfolio/refs/heads/main/moonthing.png')`;
                    }

                    // Update badges
                    if (data.badges && data.badges.length > 0) {
                        const badgesContainer = document.getElementById('discord-badges');
                        badgesContainer.innerHTML = '';
                        data.badges.forEach(badge => {
                            const img = document.createElement('img');
                            img.src = badge.icon;
                            img.className = 'discord-badge-icon';
                            img.title = badge.name;
                            img.alt = badge.name;
                            badgesContainer.appendChild(img);
                        });
                        badgesContainer.style.display = 'flex';
                    }
                })
                .catch(err => {
                    console.error("Failed to load Discord info:", err);
                });
        }
        fetchDiscordInfo();

        // ── Custom cursor ───────────────────────────────────────────
        const cursor = document.createElement('img');
        cursor.id = 'custom-cursor';
        cursor.src = 'https://raw.githubusercontent.com/9-0-9-9/Website_portfolio/refs/heads/main/cursor.png';
        document.body.appendChild(cursor);

        let prevX = 0, prevY = 0, lastMoveTime = 0;

        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top  = e.clientY + 'px';

            const dx    = e.clientX - prevX;
            const dy    = e.clientY - prevY;
            const speed = Math.sqrt(dx * dx + dy * dy);

            if (speed > 3) {
                const now = Date.now();
                const gap = Math.max(30, 120 - speed * 3);
                if (now - lastMoveTime > gap) {
                    lastMoveTime = now;
                    spawnCursorFeather(e.clientX, e.clientY, dx, dy, speed);
                }
            }

            prevX = e.clientX;
            prevY = e.clientY;
        });

        document.addEventListener('mousedown', () => cursor.classList.add('clicking'));
        document.addEventListener('mouseup',   () => cursor.classList.remove('clicking'));

        // ── Direction-aware feather particles (using JPG) ─────────
        function spawnCursorFeather(x, y, dx, dy, speed) {
            const f = document.createElement('img');
            f.src = 'https://raw.githubusercontent.com/9-0-9-9/Website_portfolio/refs/heads/main/IMG_4459.jpg';
            f.className = 'cursor-feather';

            const trailAngle = Math.atan2(-dy, -dx);
            const spread     = (Math.random() - 0.5) * 1.2;
            const finalAngle = trailAngle + spread;

            const dist = Math.min(20 + speed * 1.2, 70);
            const fx   = Math.round(Math.cos(finalAngle) * dist) + 'px';
            const fy   = Math.round(Math.sin(finalAngle) * dist) + 'px';

            const startRot = Math.round(trailAngle * (180 / Math.PI)) + 'deg';
            const endRot   = Math.round(trailAngle * (180 / Math.PI) + (Math.random() * 180 - 90)) + 'deg';

            const dur = Math.max(0.5, 1.1 - speed * 0.012) + 's';

            f.style.setProperty('--fx',     fx);
            f.style.setProperty('--fy',     fy);
            f.style.setProperty('--fstart', startRot);
            f.style.setProperty('--fend',   endRot);
            f.style.setProperty('--fd',     dur);
            f.style.left = (x - 6) + 'px';
            f.style.top  = (y - 6) + 'px';

            document.body.appendChild(f);
            setTimeout(() => f.remove(), parseFloat(dur) * 1000 + 100);
        }
    </script>
